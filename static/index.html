<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-host</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2128; --muted: #667085; --line: #e3e6eb;
    --accent: #3b5bdb; --ok: #2b8a3e; --bad: #c92a2a; --warn: #b36b00; --chip: #eef1f6;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --ink: #e8eaee; --muted: #9aa3b2; --line: #2e333b;
      --accent: #7c9cff; --ok: #5cc679; --bad: #ff6b6b; --warn: #f0a845; --chip: #272b33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  #status { color: var(--muted); }
  #status b { color: var(--ink); }
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
  .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2, .column h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
                          letter-spacing: .04em; color: var(--muted); }
  .board { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(340px, 1.7fr) minmax(200px, 1fr); gap: 12px; }
  .column { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
            min-height: 160px; display: flex; flex-direction: column; gap: 10px; }
  .column h2 .count { color: var(--ink); }
  .empty { color: var(--muted); font-style: italic; margin: 0; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  code { font-family: var(--mono); font-size: 12px; }
  .error { color: var(--bad); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
          background: var(--chip); color: var(--muted); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
           border: 1px solid var(--line); background: var(--chip); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], textarea, select { font: inherit; width: 100%; padding: 6px 8px; border-radius: 7px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
  form { display: grid; gap: 8px; margin: 0; }
  label.field { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .server { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .server-head { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .server-head .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .server-head .actions { margin-left: auto; display: flex; gap: 6px; }
  .server-head .actions button { padding: 2px 9px; font-size: 12px; }
  .server .command { margin: 4px 0 6px; overflow-wrap: anywhere; }
  .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .tools li { padding: 5px 8px; border-radius: 6px; background: var(--chip); }
  .tools .tname { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .tools .targs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .tools .tdesc { font-size: 12.5px; color: var(--muted); }
  .runs { display: flex; flex-direction: column; gap: 10px; }
  .runs:empty::before { content: attr(data-empty); color: var(--muted); font-style: italic; }
  .toolpick { display: grid; gap: 8px; }
  .toolpick fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 6px 10px 8px; }
  .toolpick legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .toolpick label { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12.5px; padding: 2px 0; }
  .run { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--bg); display: grid; gap: 8px; }
  .run.running { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .run-head { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .run-head .name { font-weight: 600; overflow-wrap: anywhere; }
  .run-head .rid { color: var(--muted); font-size: 12px; }
  .run-head .actions { margin-left: auto; display: flex; gap: 6px; }
  .run-head .actions button { padding: 2px 9px; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--chip); }
  .timing { font-size: 12.5px; color: var(--muted); }
  .callform { display: grid; gap: 6px; padding: 8px; border-radius: 8px; border: 1px dashed var(--line); }
  .callform .row { display: flex; gap: 6px; align-items: center; }
  .callform .row select { flex: 1; min-width: 0; }
  .callform .note { font-size: 12.5px; }
  details.log > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .calls { display: grid; gap: 6px; margin-top: 6px; }
  .call { border-left: 3px solid var(--line); padding: 4px 8px; background: var(--panel); border-radius: 0 6px 6px 0; min-width: 0; }
  .call.ok { border-left-color: var(--ok); } .call.error { border-left-color: var(--warn); }
  .call.rejected { border-left-color: var(--bad); } .call.pending { border-left-color: var(--accent); }
  .call.cancelled { border-left-color: var(--muted); }
  .call-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .call-head .tname { font-family: var(--mono); font-weight: 600; }
  .call-head .when, .call-head .ms { color: var(--muted); }
  .call .args, .call .out { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere;
                            max-height: 9em; overflow: auto; }
  .call .args { color: var(--muted); }
  .call .out.err { color: var(--bad); }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>agent-host</h1>
  <div id="status">connecting…</div>
</header>

<div class="layout">
  <div class="side">
    <section class="panel">
      <h2>MCP servers</h2>
      <div id="servers"><p class="empty">No servers connected.</p></div>
    </section>

    <section class="panel">
      <h2>Start a run</h2>
      <form id="run-form">
        <label class="field"><span>Name</span>
          <input type="text" name="runname" placeholder="my run" autocomplete="off"></label>
        <div class="field"><span class="muted" style="font-size:12.5px">Tools this run may use</span>
          <div class="toolpick" id="toolpick"><p class="empty">Connect a server first.</p></div></div>
        <div><button class="primary" type="submit">Start run</button></div>
        <div class="error" id="run-error"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Connect an MCP server</h2>
      <form id="connect-form">
        <label class="field"><span>Command, run in the project folder (<code>python</code> = this project's Python)</span>
          <input type="text" name="command" placeholder="python my_server.py" required autocomplete="off"></label>
        <label class="field"><span>Name (optional)</span>
          <input type="text" name="name" placeholder="from the server" autocomplete="off"></label>
        <div><button class="primary" type="submit">Connect</button></div>
        <div class="error" id="connect-error"></div>
      </form>
    </section>
  </div>

  <main class="board">
    <section class="column"><h2>Waiting <span class="count" id="count-waiting">0</span></h2><div class="runs" id="col-waiting" data-empty="No runs waiting."></div></section>
    <section class="column"><h2>Running <span class="count" id="count-running">0</span></h2><div class="runs" id="col-running" data-empty="No runs running."></div></section>
    <section class="column"><h2>Done <span class="count" id="count-done">0</span></h2><div class="runs" id="col-done" data-empty="No finished runs yet."></div></section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
const seen = {};  // last rendered signature per section, to skip redraws that change nothing

// h("div", {class: "x", onclick: fn}, child, "text", ...) -> element
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

function changed(key, value) {
  const sig = JSON.stringify(value);
  if (seen[key] === sig) return false;
  seen[key] = sig;
  return true;
}

async function api(method, url, body) {
  const res = await fetch(url, {method, headers: {"Content-Type": "application/json"},
                                body: body === undefined ? undefined : JSON.stringify(body)});
  const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (data.detail && JSON.stringify(data.detail)) || res.statusText);
  return data;
}

function argList(schema) {
  const props = Object.keys((schema && schema.properties) || {});
  const req = new Set((schema && schema.required) || []);
  return props.map((p) => req.has(p) ? p : p + "?").join(", ");
}

function renderServers(servers) {
  if (!changed("servers", servers)) return;
  const box = $("servers");
  box.replaceChildren();
  if (!servers.length) box.append(h("p", {class: "empty"}, "No servers connected."));
  for (const s of servers) {
    const pill = {connected: "ok", disconnected: "bad", connecting: "warn"}[s.status] || "";
    box.append(h("div", {class: "server"},
      h("div", {class: "server-head"},
        h("span", {class: "name"}, s.name),
        h("span", {class: "pill " + pill}, s.status),
        h("span", {class: "actions"},
          s.status === "disconnected" && h("button", {onclick: (e) => serverAction(e, "POST", `/api/servers/${s.id}/reconnect`)}, "Reconnect"),
          !s.builtin && h("button", {class: "danger", onclick: (e) => serverAction(e, "DELETE", `/api/servers/${s.id}`)}, "Remove"))),
      h("div", {class: "command mono muted"}, "$ " + s.command),
      s.error && h("div", {class: "error"}, s.error),
      s.tools.length
        ? h("ul", {class: "tools"}, s.tools.map((t) => h("li", {},
            h("span", {class: "tname"}, t.name), " ", h("span", {class: "targs"}, "(" + argList(t.input_schema) + ")"),
            t.description && h("div", {class: "tdesc"}, t.description))))
        : h("p", {class: "empty"}, s.status === "connected" ? "This server offers no tools." : "No tools.")));
  }
}

async function serverAction(e, method, url) {
  e.target.disabled = true;
  try { await api(method, url); } catch (err) { alertInline(err.message); }
  refresh();
}

// ---------------------------------------------------------------- start a run

function connectedTools(s) {
  return s.servers.filter((x) => x.status === "connected")
    .map((x) => ({server: x.name, tools: x.tools.map((t) => ({...t, id: `${x.name}/${t.name}`}))}));
}

function renderToolPick(s) {
  const groups = connectedTools(s);
  if (!changed("toolpick", groups.map((g) => [g.server, g.tools.map((t) => t.name)]))) return;
  const box = $("toolpick");
  const checked = new Set([...box.querySelectorAll("input:checked")].map((i) => i.value));
  box.replaceChildren();
  if (!groups.length) box.append(h("p", {class: "empty"}, "Connect a server first."));
  for (const g of groups) {
    box.append(h("fieldset", {}, h("legend", {}, g.server),
      g.tools.map((t) => h("label", {title: t.description},
        h("input", {type: "checkbox", value: t.id, checked: checked.has(t.id)}), t.name))));
  }
}

$("run-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, button = form.querySelector("button[type=submit]");
  const tools = [...$("toolpick").querySelectorAll("input:checked")].map((i) => i.value);
  button.disabled = true; $("run-error").textContent = "";
  try {
    await api("POST", "/api/runs", {name: form.elements.runname.value, tools});
    form.elements.runname.value = "";
  } catch (err) {
    $("run-error").textContent = err.message;
  }
  button.disabled = false;
  refresh();
});

// ---------------------------------------------------------------- runs

const cards = new Map();  // run id -> {el, parts..., state, logSig, toolSig}

function secs(t) { return Math.max(0, Math.round(t)) + " s"; }
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], {hour12: false}); }

function schemaTemplate(schema) {
  const out = {};
  const props = (schema && schema.properties) || {};
  for (const [k, p] of Object.entries(props)) {
    const type = Array.isArray(p.type) ? p.type[0] : p.type;
    out[k] = p.default !== undefined ? p.default
      : {string: "", integer: 0, number: 0, boolean: false, array: [], object: {}}[type] ?? null;
  }
  return JSON.stringify(out, null, 1).replace(/\n\s*/g, " ");
}

function makeCard(r) {
  const c = {state: null, logSig: null, toolSig: null, actionSig: null};
  c.name = h("span", {class: "name"});
  c.pill = h("span", {class: "pill"});
  c.actions = h("span", {class: "actions"});
  c.chips = h("div", {class: "chips"});
  c.timing = h("div", {class: "timing"});
  c.formSlot = h("div");
  c.calls = h("div", {class: "calls"});
  c.summary = h("summary");
  c.log = h("details", {class: "log", open: r.state !== "done"}, c.summary, c.calls);
  c.el = h("div", {class: "run"},
    h("div", {class: "run-head"}, c.name, h("span", {class: "rid"}, "#" + r.id), c.pill, c.actions),
    c.chips, c.timing, c.formSlot, c.log);
  cards.set(r.id, c);
  return c;
}

function makeCallForm(r, c) {
  const select = h("select", {name: "tool"});
  const args = h("textarea", {name: "arguments", rows: 2, spellcheck: "false"});
  const note = h("div", {class: "note"});
  const send = h("button", {class: "primary", type: "submit"}, "Send");
  select.addEventListener("change", () => {
    const t = c.toolInfo[select.value];
    args.value = t ? schemaTemplate(t.input_schema) : "{}";
  });
  const form = h("form", {class: "callform"},
    h("div", {class: "row"}, select, send), args, note);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    let parsed;
    try { parsed = args.value.trim() ? JSON.parse(args.value) : {}; }
    catch (err) { note.className = "note error"; note.textContent = "Arguments are not valid JSON: " + err.message; return; }
    send.disabled = true; note.className = "note muted"; note.textContent = "Calling…";
    try {
      const res = await fetch(`/api/runs/${r.id}/calls`, {method: "POST", headers: {"Content-Type": "application/json"},
                              body: JSON.stringify({tool: select.value, arguments: parsed})});
      const call = await res.json();
      if (call.status === "ok") { note.className = "note"; note.textContent = "OK: " + (call.text || "(no content)"); }
      else {
        const why = call.error || call.detail || res.statusText;
        note.className = "note error"; note.textContent = why.startsWith(call.status) ? why : `${call.status}: ${why}`;
      }
    } catch (err) { note.className = "note error"; note.textContent = err.message; }
    send.disabled = false;
    refresh();
  });
  c.select = select; c.args = args;
  return form;
}

function fillToolSelect(r, c, s) {
  // Every tool any connected server offers, so you can also see the host reject one.
  const all = connectedTools(s).flatMap((g) => g.tools);
  const sig = JSON.stringify([all.map((t) => t.id), r.tools]);
  if (c.toolSig === sig) return;
  c.toolSig = sig;
  c.toolInfo = Object.fromEntries(all.map((t) => [t.id, t]));
  const keep = c.select.value;
  const allowed = all.filter((t) => r.tools.includes(t.id));
  const others = all.filter((t) => !r.tools.includes(t.id));
  c.select.replaceChildren(...[
    allowed.length && h("optgroup", {label: "Allowed for this run"}, allowed.map((t) => h("option", {value: t.id}, t.id))),
    others.length && h("optgroup", {label: "Not allowed (the host will reject)"}, others.map((t) => h("option", {value: t.id}, t.id))),
  ].filter(Boolean));
  if (keep && c.toolInfo[keep]) c.select.value = keep;
  if (!keep) c.select.dispatchEvent(new Event("change"));
}

function renderCall(call) {
  const verdict = call.allowed ? h("span", {class: "pill ok"}, "allowed") : h("span", {class: "pill bad"}, "rejected");
  const status = call.allowed && h("span", {class: "pill " + ({ok: "ok", error: "warn", pending: "", cancelled: ""}[call.status] || "")},
                                   call.status === "pending" ? "waiting for server…" : call.status);
  const out = call.status === "ok" ? h("div", {class: "out"}, call.text || "(no content)")
    : call.error ? h("div", {class: "out err"}, call.error) : null;
  return h("div", {class: "call " + call.status},
    h("div", {class: "call-head"}, h("span", {class: "when"}, clock(call.at)), h("span", {class: "tname"}, call.tool),
      verdict, status, call.ms != null && h("span", {class: "ms"}, call.ms + " ms")),
    h("div", {class: "args"}, JSON.stringify(call.arguments)),
    out);
}

async function runAction(e, url) {
  e.target.disabled = true;
  try { await api("POST", url); } catch (err) { $("run-error").textContent = err.message; }
  refresh();
}

function updateCard(c, r, s) {
  c.el.className = "run " + r.state;
  c.name.textContent = r.name;
  const pillClass = {running: "warn", waiting: "", done: {completed: "ok", failed: "bad", cancelled: ""}[r.outcome] || ""}[r.state];
  c.pill.className = "pill " + pillClass;
  c.pill.textContent = r.state === "done" ? r.outcome : r.state;

  if (c.actionSig !== r.state) {
    c.actionSig = r.state;
    c.actions.replaceChildren(...[
      r.state === "running" && h("button", {onclick: (e) => runAction(e, `/api/runs/${r.id}/finish`)}, "Finish"),
      r.state !== "done" && h("button", {class: "danger", onclick: (e) => runAction(e, `/api/runs/${r.id}/cancel`)}, "Cancel"),
    ].filter(Boolean));
    c.chips.replaceChildren(...r.tools.map((t) => h("span", {class: "chip"}, t)));
  }

  if (r.state === "running") c.timing.textContent =
    `running for ${secs(s.now - r.started_at)} · fails if still running in ${secs(r.deadline - s.now)}`;
  else if (r.state === "waiting") c.timing.textContent =
    `waiting for a desk · #${s.runs.filter((x) => x.state === "waiting" && x.id <= r.id).length} in line`;
  else if (r.state === "done") c.timing.textContent = (r.reason ? r.reason + " · " : "") +
    `ended ${clock(r.ended_at)}` + (r.started_at ? ` after ${secs(r.ended_at - r.started_at)}` : "");

  if (r.state === "running" && !c.form) { c.form = makeCallForm(r, c); c.formSlot.append(c.form); }
  if (r.state !== "running" && c.form) { c.form.remove(); c.form = null; }
  if (c.form) fillToolSelect(r, c, s);

  if (c.state !== r.state) {
    if (c.state && r.state === "done") c.log.open = false;  // tidy up finished runs
    c.state = r.state;
  }
  const sig = JSON.stringify(r.calls.map((x) => [x.id, x.status]));
  if (c.logSig !== sig) {
    c.logSig = sig;
    c.summary.textContent = r.calls.length ? `call log (${r.calls.length})` : "call log (empty)";
    c.calls.replaceChildren(...[...r.calls].reverse().map(renderCall));
  }
}

function renderRuns(s) {
  const lists = {waiting: [], running: [], done: []};
  for (const r of s.runs) lists[r.state].push(r);
  lists.done.sort((a, b) => b.ended_at - a.ended_at);
  lists.running.sort((a, b) => a.started_at - b.started_at);
  const live = new Set(s.runs.map((r) => r.id));
  for (const [state, runs] of Object.entries(lists)) {
    const col = $("col-" + state);
    runs.forEach((r, i) => {
      const c = cards.get(r.id) || makeCard(r);
      updateCard(c, r, s);
      if (col.children[i] !== c.el) col.insertBefore(c.el, col.children[i] || null);
    });
    while (col.children.length > runs.length) col.lastChild.remove();
  }
  for (const id of [...cards.keys()]) if (!live.has(id)) { cards.get(id).el.remove(); cards.delete(id); }
}

function alertInline(msg) { $("connect-error").textContent = msg; }

$("connect-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, button = form.querySelector("button");
  button.disabled = true; button.textContent = "Connecting…"; $("connect-error").textContent = "";
  try {
    await api("POST", "/api/servers", {command: form.elements.command.value, name: form.elements.namedItem("name").value});
    form.reset();
  } catch (err) {
    $("connect-error").textContent = "Not connected: " + err.message;
  }
  button.disabled = false; button.textContent = "Connect";
  refresh();
});

function renderStatus(s) {
  const connected = s.servers.filter((x) => x.status === "connected").length;
  const count = (state) => s.runs.filter((r) => r.state === state).length;
  $("status").innerHTML =
    `servers connected <b>${connected}</b> · runs waiting <b>${count("waiting")}</b> · ` +
    `runs running <b>${count("running")}</b> · desk limit <b>${s.desk_limit}</b>`;
  for (const st of ["waiting", "running", "done"]) $("count-" + st).textContent = count(st);
}

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    state = s;
    renderStatus(s);
    renderServers(s.servers);
    renderToolPick(s);
    renderRuns(s);
  } catch (e) {
    $("status").textContent = "host not reachable";
  }
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
